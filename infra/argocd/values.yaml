argo-cd:
  global:
    domain: argocd.eugenebox.uk

  configs:
    cm:
      url: https://argocd.eugenebox.uk
      admin.enabled: "true"
    params:
      server.insecure: true

  server:
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - argocd.eugenebox.uk
      annotations:
        kubernetes.io/ingress.class: traefik
      tls: []
    extraArgs:
      - --insecure
