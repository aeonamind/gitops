apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "toolbox.fullname" . }}
  labels:
    {{- include "toolbox.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "toolbox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "toolbox.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: toolbox
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | toString }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: VAULT_ADDR
              value: {{ .Values.vault.addr | quote }}
            - name: PGHOST
              value: {{ .Values.postgresql.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgresql.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgresql.database | quote }}
            - name: PGUSER
              value: {{ .Values.postgresql.user | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              apk add --no-cache postgresql-client curl bash jq unzip
              ARCH=$(uname -m | sed 's/aarch64/arm64/;s/x86_64/amd64/')
              VAULT_VER={{ .Values.vault.cliVersion | quote }}
              curl -fsSL "https://releases.hashicorp.com/vault/${VAULT_VER}/vault_${VAULT_VER}_linux_${ARCH}.zip" \
                -o /tmp/vault.zip
              unzip -qo /tmp/vault.zip -d /usr/local/bin
              rm /tmp/vault.zip
              echo "Toolbox ready. Try: vault status | psql -c 'SELECT 1;'"
              exec sleep infinity
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
