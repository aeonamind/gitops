apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gunner2.fullname" . }}
  labels:
    {{- include "gunner2.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  # Stop the old pod before starting the new one: rooms are in memory, and two pods
  # behind one Service would send room-code joins to the wrong pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gunner2.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gunner2.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | toString }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: "2567"
          ports:
            - name: http
              containerPort: 2567
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
