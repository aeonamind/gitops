# Optional: set to override generated resource names (default is release name).
# fullnameOverride: ""

# Image built by CI (see sound-bot repo). Pin a tag in prod instead of :latest.
image:
  repository: aeonamind/sound-bot
  tag: 186046d57f27c4185144e4c81f175e550eef8830
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: dockerhub-secret
replicas: 1
service:
  type: ClusterIP
  port: 3000
ingress:
  enabled: true
  className: traefik
  host: soundbot.eugenebox.uk
  annotations: {}
  # tls:
  #   - secretName: sound-bot-tls
  #     hosts:
  #       - sound-bot.example.com
# Vault External Secrets configuration.
# Prerequisites: apps/vault; then:
# 1) Init/unseal Vault, enable KV v2:  vault secrets enable -path=secret kv-v2
# 2) Store:  vault kv put secret/data/sound-bot BOT_TOKEN=... CLIENT_ID=...
# 3) YouTube cookies (Netscape format, patch — do not use put):
#    kubectl cp secrets/youtube-cookies.txt vault/vault-0:/tmp/youtube-cookies.txt
#    kubectl exec -n vault vault-0 -- sh -c \
#      'VAULT_ADDR=http://127.0.0.1:8200 vault kv patch secret/sound-bot YOUTUBE_COOKIES=@/tmp/youtube-cookies.txt'
# 4) Configure K8s Auth and Role in Vault (see instructions provided).
vault:
  enabled: true
  role: sound-bot-role
  remotePath: secret/data/sound-bot
  dockerConfigPath: secret/data/dockerhub
  appSecretKeys:
    - BOT_TOKEN
    - CLIENT_ID
    - SPOTIFY_CLIENT_ID
    - SPOTIFY_CLIENT_SECRET
    - BOT_ENABLED
  youtubeCookiesKey: YOUTUBE_COOKIES
resources: {}
