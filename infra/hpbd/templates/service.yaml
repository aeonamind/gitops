apiVersion: v1
kind: Service
metadata:
  name: {{ include "hpbd.fullname" . }}
  labels:
    {{- include "hpbd.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "hpbd.selectorLabels" . | nindent 4 }}
