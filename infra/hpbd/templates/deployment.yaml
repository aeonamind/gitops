apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hpbd.fullname" . }}
  labels:
    {{- include "hpbd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "hpbd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hpbd.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "hpbd.fullname" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | toString }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # Page content + TRACK_TOPIC come from Vault as files (one per key). The server
            # re-reads them, so editing Vault updates the page without restarting the pod.
            - name: CONFIG_DIR
              value: /config
            - name: NTFY_URL
              value: {{ .Values.tracking.ntfyUrl | quote }}
          volumeMounts:
            - name: content
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: content
          secret:
            secretName: {{ include "hpbd.fullname" . }}-secrets
