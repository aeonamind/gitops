apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hpbd.fullname" . }}
  labels:
    {{- include "hpbd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "hpbd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hpbd.selectorLabels" . | nindent 8 }}
      annotations:
        # Content is read once at startup: roll the pod whenever the page config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "hpbd.fullname" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | toString }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "hpbd.fullname" . }}-config
            {{- if .Values.vault.enabled }}
            # optional: page still runs (tracking only logs) if the Vault secret is not ready yet
            - secretRef:
                name: {{ include "hpbd.fullname" . }}-secrets
                optional: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
