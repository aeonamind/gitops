# Every key under the Vault path (page content + TRACK_TOPIC) becomes a key of this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "hpbd.fullname" . }}-secrets
  labels:
    {{- include "hpbd.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "hpbd.fullname" . }}-vault
    kind: SecretStore
  target:
    name: {{ include "hpbd.fullname" . }}-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.vault.remotePath | replace "secret/data/" "" | quote }}
