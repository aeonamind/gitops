{{- if .Values.vault.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "hpbd.fullname" . }}-secrets
  labels:
    {{- include "hpbd.labels" . | nindent 4 }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ include "hpbd.fullname" . }}-vault
    kind: SecretStore
  target:
    name: {{ include "hpbd.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: TRACK_TOPIC
      remoteRef:
        key: {{ .Values.vault.remotePath | replace "secret/data/" "" | quote }}
        property: TRACK_TOPIC
{{- end }}
