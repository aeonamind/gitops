{{- $c := .Values.config }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hpbd.fullname" . }}-config
  labels:
    {{- include "hpbd.labels" . | nindent 4 }}
data:
  HER_NAME: {{ $c.herName | quote }}
  FROM_NAME: {{ $c.fromName | quote }}
  AGE: {{ $c.age | toString | quote }}
  PAGE_TITLE: {{ $c.pageTitle | default "" | quote }}
  UNLOCK_AT: {{ $c.unlockAt | default "" | quote }}
  MUSIC: {{ $c.music | default "" | quote }}
  INTRO: {{ join "|" ($c.intro | default list) | quote }}
  LETTER: {{ $c.letter | default "" | trim | quote }}
  WISHES_TITLE: {{ $c.wishesTitle | default "" | quote }}
  WISHES: {{ join "|" $c.wishes | quote }}
  PHOTOS: {{ $photos := list }}{{ range ($c.photos | default list) }}{{ $photos = append $photos (printf "%s::%s" .src (.caption | default "")) }}{{ end }}{{ join "|" $photos | quote }}
  FINAL_TITLE: {{ $c.finalTitle | default "" | quote }}
  FINAL_MESSAGE: {{ $c.finalMessage | default "" | trim | quote }}
  NTFY_URL: {{ .Values.tracking.ntfyUrl | quote }}
