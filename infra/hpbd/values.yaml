# Image built by CI (see hpbd repo). Pin a tag in prod instead of :latest.
image:
  repository: aeonamind/hpbd
  tag: 03bb4e5fbd1d8099076ba5a614c7dcb483711528
  pullPolicy: IfNotPresent
  # Uses the namespace-wide dockerhub-secret (created by the sound-bot app) for image pulls.
  pullSecrets:
    - name: dockerhub-secret
replicas: 1
service:
  type: ClusterIP
  port: 8080
ingress:
  enabled: true
  className: traefik
  host: hpbd.eugenebox.uk
  annotations: {}
  # tls:
  #   - secretName: hpbd-tls
  #     hosts:
  #       - hpbd.eugenebox.uk
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
# ---------------------------------------------------------------------------
# Page content. Edit here and push: ArgoCD syncs, checksum/config rolls the pod.
# Placeholders in any text: {name}, {from}, {age}.
# NOTE: this repo is public, everything below is visible to anyone.
# ---------------------------------------------------------------------------
config:
  herName: "Minh Thư"
  fromName: "Anh"
  age: 17
  pageTitle: "Sinh nhật vui vẻ, {name} 🎂"
  # Lock the page until this moment (ISO 8601 with offset), e.g. "2026-11-20T00:00:00+07:00". Preview with ?preview
  unlockAt: ""
  # Custom music file baked into the image under public/, e.g. "music.mp3"
  music: ""
  intro:
    - "Hôm nay là một ngày đặc biệt..."
    - "vì đúng {age} năm trước, {name} ra đời."
    - "Chúc mừng em đã chính thức bước sang tuổi {age}!"
    - "Anh có chuẩn bị một món quà nho nhỏ cho em đây. 🎁"
  letter: |
    Gửi {name},

    Chúc mừng sinh nhật em! {age} tuổi rồi đấy, lớn thật rồi.

    Năm nay chắc em sẽ bận hơn nhiều: học hành, thi cử, rồi bắt đầu nghĩ đến chuyện sau này. Cứ cố gắng hết sức, nhưng cũng nhớ nghỉ ngơi đúng lúc, đừng ép mình quá.

    Anh chúc em tuổi mới thật khỏe mạnh, học tốt, có nhiều bạn bè vui vẻ và luôn giữ được sự vui tươi của mình. Gặp chuyện gì khó thì cứ bình tĩnh, rồi mọi chuyện cũng sẽ ổn thôi.

    Sinh nhật vui vẻ nhé, {name}! 🎂
  wishesTitle: "{age} điều anh chúc em"
  wishes:
    - "Chúc em tuổi {age} thật nhiều niềm vui."
    - "Chúc em luôn khỏe mạnh, ít ốm vặt."
    - "Chúc em học tốt, thi đâu đỗ đó."
    - "Chúc em ngủ đủ giấc, bớt thức khuya."
    - "Chúc em ăn gì cũng thấy ngon."
    - "Chúc em có nhiều bạn bè tốt."
    - "Chúc em tự tin hơn mỗi ngày."
    - "Chúc em tìm được điều mình thật sự thích làm."
    - "Chúc em có nhiều chuyến đi chơi vui."
    - "Chúc gia đình em luôn mạnh khỏe, bình an."
    - "Chúc em gặp chuyện khó cũng bình tĩnh vượt qua."
    - "Chúc em điểm cao mà không phải học quá sức."
    - "Chúc em luôn vui vẻ và lạc quan."
    - "Chúc em có thật nhiều kỷ niệm đẹp ở tuổi {age}."
    - "Chúc mọi dự định của em đều suôn sẻ."
    - "Chúc em luôn là chính mình."
    - "Và chúc em có một ngày sinh nhật thật vui! 🎉"
  # Photos must be baked into the image under public/photos/
  photos: []
  #  - src: photos/1.jpg
  #    caption: "Kỷ niệm"
  finalTitle: "Chúc mừng sinh nhật, {name}!"
  finalMessage: |
    Chúc em tuổi {age} thật nhiều niềm vui và may mắn.
    Sinh nhật vui vẻ nhé! 🎂

# View tracking: the server forwards events to ntfy. The topic is a secret (anyone who
# knows it can read the notifications), so it lives in Vault, not in this public repo.
tracking:
  ntfyUrl: https://ntfy.sh
# Vault External Secrets (same setup as sound-bot). Already provisioned:
#   secret/hpbd           TRACK_TOPIC=<topic>   (vault kv patch secret/hpbd TRACK_TOPIC=... to change)
#   policy hpbd-policy    read secret/data/hpbd
#   role   hpbd-role      SA "hpbd" in namespace "application" -> hpbd-policy, ttl 1h
# Until the secret syncs the page still works; tracking is only logged (kubectl logs).
vault:
  enabled: true
  role: hpbd-role
  remotePath: secret/data/hpbd
