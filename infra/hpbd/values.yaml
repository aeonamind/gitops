# Image built by CI (see hpbd repo). Pin a tag in prod instead of :latest.
image:
  repository: aeonamind/hpbd
  tag: 7ddc7e0b5d48026221d9281bc660c2a9a57968ca
  pullPolicy: IfNotPresent
  # Uses the namespace-wide dockerhub-secret (created by the sound-bot app) for image pulls.
  pullSecrets:
    - name: dockerhub-secret
replicas: 1
service:
  type: ClusterIP
  port: 8080
ingress:
  enabled: true
  className: traefik
  host: hpbd.eugenebox.uk
  annotations: {}
  # tls:
  #   - secretName: hpbd-tls
  #     hosts:
  #       - hpbd.eugenebox.uk
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
# ---------------------------------------------------------------------------
# Page content (name, age, wishes, letter...) lives in Vault, NOT here: this repo is public.
# Vault path secret/hpbd, one key per field (same names as .env.example in the hpbd repo):
#   HER_NAME, FROM_NAME, AGE, PAGE_TITLE, UNLOCK_AT, MUSIC, INTRO, LETTER,
#   WISHES_TITLE, WISHES, PHOTOS, FINAL_TITLE, FINAL_MESSAGE, TRACK_TOPIC
# INTRO / WISHES / PHOTOS: one item per line. Placeholders: {name}, {from}, {age}.
# Edit in the Vault UI or:  vault kv patch secret/hpbd AGE=18
# The page updates by itself within ~refreshInterval + 1-2 min (no restart, no git push).
# An invalid value (e.g. AGE=abc) is ignored and logged; the previous content keeps serving.
# ---------------------------------------------------------------------------
tracking:
  ntfyUrl: https://ntfy.sh

# Vault External Secrets (same setup as sound-bot). Provisioned:
#   policy hpbd-policy  read secret/data/hpbd
#   role   hpbd-role    SA "hpbd" in namespace "application" -> hpbd-policy, ttl 1h
vault:
  role: hpbd-role
  # How often External Secrets re-reads Vault (content edits show up after this + kubelet sync)
  refreshInterval: 1m
  remotePath: secret/data/hpbd
