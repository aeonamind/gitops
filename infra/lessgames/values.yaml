# Image built by CI (see lessgames repo). Pin a tag in prod instead of :latest.
image:
  repository: aeonamind/lessgames
  tag: 5d52bf31c1afab7e2abbf6fe7635882c9ca4d94f
  pullPolicy: IfNotPresent
  # Uses the namespace-wide dockerhub-secret for image pulls.
  pullSecrets:
    - name: dockerhub-secret
replicas: 1
service:
  type: ClusterIP
  port: 3000
ingress:
  enabled: true
  className: traefik
  host: lessgames.eugenebox.uk
  annotations: {}
  # tls:
  #   - secretName: lessgames-tls
  #     hosts:
  #       - lessgames.eugenebox.uk
resources: {}
